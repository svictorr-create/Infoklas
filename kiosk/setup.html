<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><title>Налаштування кіоску</title>
<style>
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f6fb; font: 16px system-ui, "Segoe UI", sans-serif; }
  form { background: #fff; padding: 30px; border-radius: 16px; width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,.1); }
  label { display: block; margin-bottom: 12px; font-weight: 500; } input { width: 100%; box-sizing: border-box; font: inherit; padding: 9px; border: 1px solid #cfd5e3; border-radius: 8px; margin-top: 4px; }
  button { width: 100%; padding: 12px; font: inherit; font-weight: 600; background: #3b5bdb; color: #fff; border: none; border-radius: 10px; cursor: pointer; }
  #err { color: #e03131; margin-top: 10px; } p { color: #6b7489; font-size: .9em; }
</style></head>
<body><form id="f">
  <h2>💻 ІнфоКлас — перше налаштування ПК</h2>
  <p>Виконується один раз вчителем. Після цього комп'ютер після кожного перезавантаження буде заблокований до розблокування вчителем.</p>
  <label>Адреса сервера<input name="server" placeholder="https://infoklas.example.com" required></label>
  <label>Номер цього комп'ютера<input name="computer_no" type="number" min="1" required></label>
  <label>Логін вчителя<input name="login" required></label>
  <label>Пароль вчителя<input name="password" type="password" required></label>
  <button>Зареєструвати комп'ютер</button>
  <div id="err"></div>
</form>
<script>
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    const r = await window.kiosk.register(d);
    if (!r.ok) document.getElementById('err').textContent = r.error;
  };
</script></body></html>
