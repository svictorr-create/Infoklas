# Збірка Android-додатку вчителя (APK). Запуск: Actions → «Додаток вчителя (APK)» → Run workflow.
# Щоб оновлення ставилися поверх уже встановленого додатку, APK має підписуватися ТИМ САМИМ ключем:
# додайте в Settings → Secrets and variables → Actions два секрети:
#   INFOKLAS_KEYSTORE_B64      — файл ключа (infoklas-teacher.jks), закодований у base64
#   INFOKLAS_KEYSTORE_PASSWORD — пароль ключа
# Без секретів APK буде підписано тимчасовим ключем (для перевірки; оновлення поверх не встановиться).
name: Додаток вчителя (APK)
on:
  workflow_dispatch:
  push:
    tags: ['app-v*']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Ключ підпису
        env: { KS: '${{ secrets.INFOKLAS_KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/ks.jks"; echo "INFOKLAS_KEYSTORE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV";
          else echo "::warning::Секрет INFOKLAS_KEYSTORE_B64 не задано — APK підписано тимчасовим ключем"; fi
      - name: Збірка APK
        working-directory: android
        env:
          INFOKLAS_KEYSTORE_PASSWORD: ${{ secrets.INFOKLAS_KEYSTORE_PASSWORD }}
          INFOKLAS_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon
      - run: mv android/app/build/outputs/apk/release/app-release.apk "InfoKlas-Vchytel-1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: infoklas-vchytel-apk, path: '*.apk' }
